<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FitCoach</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; display: grid;
             place-items: center; min-height: 100dvh; background: #F8FAFC;
             color: #0F172A; padding: 24px; text-align: center; }
      p { color: #64748B; max-width: 34ch; line-height: 1.6; }
    </style>
  </head>
  <body>
    <!-- Only shown when the remote origin cannot be reached. A blank white
         screen with no explanation is the worst possible failure here. -->
    <div>
      <h1>No connection</h1>
      <p>FitCoach needs a network connection to load your plan. Check your
         connection and reopen the app.</p>
    </div>
  </body>
</html>
